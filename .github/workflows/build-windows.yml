name: Build Windows App

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name speech-to-text-zh app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: speech-to-text-zh-windows
          path: dist/speech-to-text-zh.exe
      - name: Attach executable to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/speech-to-text-zh.exe --clobber
